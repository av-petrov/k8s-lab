# Prometheus (чарт prometheus-community/prometheus, версия — targetRevision в argocd/bootstrap/apps/40-prometheus.yaml).
# Лёгкий вариант для kind: только server (без alertmanager, pushgateway, node-exporter, kube-state-metrics),
# короткое хранение, узкий набор целей:
#   - сам Prometheus;
#   - Argo CD /metrics (controller 8082, server 8083, repo-server 8084);
#   - cAdvisor kubelet (CPU/память контейнеров; оставляем только нужные метрики, чтобы не раздувать TSDB).
# Сетевой доступ: policies/40-monitoring.yaml (egress) и policies/10-argocd.yaml (ingress к метрикам Argo CD).
# Доступ: make prometheus-ui -> http://localhost:9090 (только port-forward, Service ClusterIP).

alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false

server:
  # Хранение: 24 часа и не больше 1 GB (что наступит раньше). Для диагностики «что сломалось сейчас» достаточно.
  retention: "24h"
  retentionSize: "1GB"
  persistentVolume:
    enabled: true
    size: 2Gi              # storageClass по умолчанию (standard, local-path)
  global:
    scrape_interval: 30s
    scrape_timeout: 10s
    evaluation_interval: 1m
  extraFlags:
    - web.enable-lifecycle          # нужен config-reloader (POST /-/reload изнутри пода)
    - storage.tsdb.wal-compression
    # admin API НЕ включаем: удаление серий / snapshot недоступны
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 768Mi
  service:
    type: ClusterIP

# Встроенные задания чарта выключены (обнаруживают всё подряд по аннотациям) — оставляем только свои.
scrapeConfigs:
  prometheus:
    enabled: true
  kubernetes-api-servers:
    enabled: false
  kubernetes-nodes:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false

  # cAdvisor: kubelet :10250 напрямую (адрес узла), TLS kubelet самоподписанный.
  kubernetes-nodes-cadvisor:
    enabled: true
    metric_relabel_configs:
      - source_labels: [__name__]
        action: keep
        regex: container_(cpu_usage_seconds_total|memory_working_set_bytes|cpu_cfs_throttled_periods_total|cpu_cfs_periods_total|oom_events_total|spec_memory_limit_bytes|last_seen)
      - source_labels: [container]
        action: drop
        regex: ""                     # серии уровня pod/cgroup без контейнера
      - action: labeldrop
        regex: (id|name|image)

  # Argo CD: собственные метрики компонентов (pod discovery в namespace argocd, только порты метрик).
  argocd:
    enabled: true
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [argocd]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name, __meta_kubernetes_pod_container_port_number]
        action: keep
        regex: argocd-application-controller;8082|argocd-server;8083|argocd-repo-server;8084
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        target_label: component
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
