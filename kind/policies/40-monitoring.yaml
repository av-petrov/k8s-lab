# Prometheus (namespace monitoring) поверх baseline default deny.
# Ingress не нужен: UI/API только через `kubectl port-forward` (make prometheus-ui), пробы kubelet разрешены baseline.
# Парная ingress-политика для метрик Argo CD — argocd-metrics-from-prometheus в 10-argocd.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-egress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: server
  egress:
    # service discovery (pods, nodes) через kube-apiserver
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # cAdvisor kubelet: свой узел (host) и остальные (remote-node; у control-plane ещё identity kube-apiserver)
    - toEntities:
        - host
        - remote-node
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # метрики Argo CD
    - toEndpoints:
        - matchExpressions:
            - key: io.kubernetes.pod.namespace
              operator: In
              values: [argocd]
            - key: app.kubernetes.io/name
              operator: In
              values:
                - argocd-application-controller
                - argocd-server
                - argocd-repo-server
      toPorts:
        - ports:
            - port: "8082"
              protocol: TCP
            - port: "8083"
              protocol: TCP
            - port: "8084"
              protocol: TCP
