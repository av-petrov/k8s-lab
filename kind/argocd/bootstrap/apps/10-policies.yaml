# Этап 1 переноса: сетевые политики из kind/policies/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"   # раньше остальных приложений
spec:
  project: platform
  source:
    repoURL: https://github.com/av-petrov/k8s-lab.git
    targetRevision: main
    path: kind/policies
  destination:
    server: https://kubernetes.default.svc
    # Пустой namespace не совпадает ни с одним destination AppProject platform -> InvalidSpecError.
    # Это только значение по умолчанию: у всех CNP в policies/ namespace задан явно, CCNP и Namespace — кластерные.
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
