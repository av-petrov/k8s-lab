# Sealed Secrets controller — первым: от него зависят SealedSecret остальных приложений.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-20"
spec:
  project: platform
  sources:
    - repoURL: https://bitnami.github.io/sealed-secrets
      chart: sealed-secrets
      targetRevision: 2.22.0          # controller v0.41.2
      helm:
        releaseName: sealed-secrets
        valueFiles:
          - $values/kind/sealed-secrets/values.yaml
    - repoURL: https://github.com/av-petrov/k8s-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false     # CRD и контроллер не удаляем автоматически: без них пропадут все расшифрованные Secret при пересинке
      selfHeal: true
