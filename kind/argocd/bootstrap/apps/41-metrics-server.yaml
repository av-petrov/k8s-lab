# metrics-server: Metrics API для kubectl top / HPA. Multi-source: чарт + values из нашего Git.
# Версию чарта определять `helm search repo metrics-server/metrics-server --versions`, не по памяти.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.14.0          # metrics-server v0.9.0
      helm:
        releaseName: metrics-server
        valueFiles:
          - $values/kind/monitoring/metrics-server/values.yaml
    - repoURL: https://github.com/av-petrov/k8s-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
