# AppProject platform. Применяется вручную при bootstrap (make argocd-bootstrap), дальше меняется через Git.
# AppProject для платформенных компонентов: ограничены репозитории, destinations и типы ресурсов.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Platform components of kind-dev01 (sealed-secrets, policies, audit shipper, prometheus, argocd, cilium)
  sourceRepos:
    - https://github.com/av-petrov/k8s-lab.git
    - https://argoproj.github.io/argo-helm
    - https://helm.cilium.io
    - https://fluent.github.io/helm-charts
    - https://bitnami.github.io/sealed-secrets
    - https://prometheus-community.github.io/helm-charts
    - https://kubernetes-sigs.github.io/metrics-server/
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
    - server: https://kubernetes.default.svc
      namespace: audit-logging
    - server: https://kubernetes.default.svc
      namespace: litellm          # только CNP из policies/
    - server: https://kubernetes.default.svc
      namespace: monitoring       # Prometheus (argocd/bootstrap/apps/40-prometheus.yaml)
    - server: https://kubernetes.default.svc
      namespace: kube-system      # Cilium, на последнем этапе
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: cilium.io
      kind: CiliumClusterwideNetworkPolicy
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition   # CRD Argo CD / Cilium
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: apiregistration.k8s.io
      kind: APIService                 # v1beta1.metrics.k8s.io (metrics-server)
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
  orphanedResources:
    warn: true
