# Root Application (app-of-apps): синхронизирует kind/argocd/bootstrap/apps/ из Git.
# Единственное Application, созданное руками; все остальные — файлы в apps/.
#   применяется один раз при bootstrap: make argocd-bootstrap
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/av-petrov/k8s-lab.git
    targetRevision: main
    path: kind/argocd/bootstrap/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false      # сначала без prune, включить после стабилизации
      selfHeal: true
