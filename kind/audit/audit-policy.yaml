# Audit policy kube-apiserver. Правила проверяются сверху вниз, срабатывает первое совпавшее.
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages:
  - RequestReceived
rules:
  # --- None: шум ---------------------------------------------------------
  - level: None
    nonResourceURLs:
      - /healthz*
      - /readyz*
      - /livez*
      - /version
      - /metrics
      - /openapi*
      - /api
      - /apis
  - level: None
    resources:
      - group: ""
        resources: ["events"]
      - group: events.k8s.io
        resources: ["events"]
  # Leader election и heartbeat нод: update раз в ~10с от каждого компонента.
  - level: None
    resources:
      - group: coordination.k8s.io
        resources: ["leases"]
  # Read-only запросы системных компонентов.
  - level: None
    verbs: ["get", "list", "watch"]
    userGroups: ["system:nodes"]
  - level: None
    verbs: ["get", "list", "watch"]
    users:
      - system:kube-scheduler
      - system:kube-controller-manager
      - system:apiserver
      - system:serviceaccount:kube-system:cilium
      - system:serviceaccount:kube-system:cilium-operator
      - system:serviceaccount:kube-system:coredns
      - system:serviceaccount:argocd:argocd-application-controller
      - system:serviceaccount:argocd:argocd-applicationset-controller
      - system:serviceaccount:argocd:argocd-server
  - level: None
    verbs: ["get", "list", "watch"]
    userGroups: ["system:serviceaccounts:kube-system"]

  # --- Metadata: чувствительные объекты, без тел запросов/ответов -------
  - level: Metadata
    resources:
      - group: ""
        resources: ["secrets", "configmaps", "serviceaccounts/token"]
      - group: authentication.k8s.io
        resources: ["tokenreviews"]
      - group: authorization.k8s.io
        resources: ["subjectaccessreviews", "selfsubjectaccessreviews", "localsubjectaccessreviews", "selfsubjectrulesreviews"]

  # --- RequestResponse: RBAC, CRD, namespace ----------------------------
  - level: RequestResponse
    verbs: ["create", "update", "patch", "delete", "deletecollection"]
    resources:
      - group: rbac.authorization.k8s.io
      - group: apiextensions.k8s.io
        resources: ["customresourcedefinitions"]
      - group: ""
        resources: ["namespaces"]

  # --- Request: прочие изменения ---------------------------------------
  - level: Request
    verbs: ["create", "update", "patch", "delete", "deletecollection"]

  # --- Metadata: остальные чтения (кто и что читал) ---------------------
  - level: Metadata
